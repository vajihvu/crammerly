services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    environment:
      - MONGO_URI=mongodb://mongodb:27017/crammerly
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: always

  mongodb:
    image: mongo:6.0
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mongodb_data:
