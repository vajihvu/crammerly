services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    environment:
      - MONGO_URI=mongodb://mongodb:27017/crammerly
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    # Structured log rotation — prevents disk exhaustion (#8)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "crammerly-app"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs — provision with certbot before first deploy:
      # docker run --rm -v /etc/letsencrypt:/etc/letsencrypt certbot/certbot certonly \
      #   --standalone -d crammerly.io -d www.crammerly.io --email your@email.com --agree-tos
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    restart: always

  mongodb:
    image: mongo:6.0
    # No ports exposed — only accessible via internal Docker network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    # No ports exposed — only accessible via internal Docker network
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Daily MongoDB backup — runs at 02:00 UTC
  backup:
    image: mongo:6.0
    entrypoint: >
      sh -c "while true; do
        sleep $$(( 86400 - $(date +%s) % 86400 ));
        sh /scripts/backup.sh;
      done"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/crammerly
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=7
    volumes:
      - ./backend/scripts/backup.sh:/scripts/backup.sh:ro
      - backups_data:/backups
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always

volumes:
  mongodb_data:
  redis_data:
  backups_data:
