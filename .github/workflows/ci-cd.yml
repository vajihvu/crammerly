name: CI / CD

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Limit concurrent deploys to same environment — cancels in-progress ones on new push
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint & Test ──────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json  # (#14) cached by lockfile hash

      - name: Install dependencies
        run: npm ci

      - name: Lint                                          # (#7)
        run: npm run lint

      - name: Security audit (no high/critical allowed)    # (#8)
        run: npm audit --audit-level=high

      - name: Unit & integration tests                     # (#5 / #6)
        run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/crammerly_test
          # NOTE: For production pipelines, store these in GitHub Secrets (${{ secrets.CI_JWT_SECRET }})
          JWT_SECRET: test-secret-that-is-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-minimum

      - name: Notify Slack on test failure                 # (#20)
        if: failure() && github.ref == 'refs/heads/main' && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "❌ *CI tests failed* on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── Stage 2: Build, SBOM & Scan ──────────────────────────────────────────────
  build:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write      # needed to upload SBOM
      packages: write
      id-token: write      # needed for SBOM attestation signing

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata                      # (#21) semver tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image                  # (#12)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true                                  # Generates SLSA build provenance
          sbom: true                                        # (#11) Generates SBOM inside the image
          cache-from: type=gha                              # (#14) GitHub Actions layer cache
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)                         # (#11) Standalone SBOM artifact
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ github.sha }}

      - name: Scan image for vulnerabilities (Trivy)       # (#13)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── Stage 3: Validate Secrets (env drift detection) ──────────────────────────
  validate-secrets:
    name: Validate Required Secrets
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'

    steps:
      - name: Check required production secrets            # (#9 / #24)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          MISSING=""
          [ -z "$MONGO_URI" ]          && MISSING="$MISSING MONGO_URI"
          [ -z "$JWT_SECRET" ]         && MISSING="$MISSING JWT_SECRET"
          [ -z "$JWT_REFRESH_SECRET" ] && MISSING="$MISSING JWT_REFRESH_SECRET"
          [ -z "$SMTP_HOST" ]          && MISSING="$MISSING SMTP_HOST"
          [ -z "$SMTP_USER" ]          && MISSING="$MISSING SMTP_USER"
          [ -z "$SMTP_PASS" ]          && MISSING="$MISSING SMTP_PASS"

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            echo "Add these in Settings → Secrets → Actions before deploying."
            exit 1
          fi
          echo "✅ All required secrets present"

  # ── Stage 4: Deploy to Staging ────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, validate-secrets]
    if: github.ref == 'refs/heads/staging'
    environment: staging                                   # (#16)

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging to staging host"
          curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"

      - name: Wait for deployment to stabilise
        run: |
          for i in $(seq 1 12); do
            curl -sf "${{ secrets.STAGING_URL }}/health" && echo "✅ Service healthy" && break
            echo "⏳ Waiting for service... ($i/12)"
            sleep 10
          done

      - name: Run smoke tests against staging              # (#19 / #25)
        run: node backend/scripts/production_smoke_test.js
        env:
          PRODUCTION_URL: ${{ secrets.STAGING_URL }}

      - name: Notify Slack — staging deployed              # (#20)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "✅ *Staging deployed* — `${{ github.sha }}` is live on staging. <${{ secrets.STAGING_URL }}|Open staging>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — staging failed                # (#20)
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "❌ *Staging deploy failed* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ── Stage 5: Deploy to Production (manual approval gate) ─────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, validate-secrets]
    if: github.ref == 'refs/heads/main'
    environment: production                               # (#17) requires manual reviewer approval

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main to production host"
          curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}"

      - name: Wait for deployment to stabilise
        run: |
          for i in $(seq 1 18); do
            curl -sf "${{ secrets.PRODUCTION_URL }}/health" && echo "✅ Service healthy" && break
            echo "⏳ Waiting for service... ($i/18)"
            sleep 10
          done

      - name: Run post-deploy smoke tests                  # (#19 / #25)
        run: node backend/scripts/production_smoke_test.js
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Create GitHub Release & version tag          # (#21)
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}-${{ github.sha }}
          name: "Release v${{ github.run_number }}"
          body: |
            **Commit:** ${{ github.sha }}
            **Actor:** ${{ github.actor }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — production deployed           # (#20)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "🚀 *Production deployed* — `${{ github.sha }}` is live. <${{ secrets.PRODUCTION_URL }}|Open app>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — production FAILED             # (#20)
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "🔴 *PRODUCTION DEPLOY FAILED* — immediate action required! <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>\n\nTo roll back: trigger the *Rollback* workflow from Actions tab."}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
