name: Rollback Production

permissions:
  contents: write
  packages: read

# (#18) Manual rollback strategy — trigger from Actions tab with a specific image tag
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll back to (e.g. main-abc1234, or a full SHA digest)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback (recorded in the GitHub Release notes)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    name: Rollback → ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    environment: production   # Still requires approval — rollbacks are production changes

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify rollback image exists
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Checking image: $IMAGE"
          docker manifest inspect "$IMAGE" || {
            echo "❌ Image tag '${IMAGE_TAG}' not found in registry."
            exit 1
          }
          echo "✅ Image verified: $IMAGE"

      - name: Deploy rollback image to production
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "⏪ Rolling back production to: ${IMAGE_TAG}"
          echo "Reason: ${REASON}"
          # Replace with your actual deploy command pointing to the specific tag:
          # curl -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}&imageTag=${IMAGE_TAG}"

      - name: Wait for rollback to stabilise
        run: |
          for i in $(seq 1 18); do
            curl -sf "${{ secrets.PRODUCTION_URL }}/health" && echo "✅ Service healthy" && break
            echo "⏳ Waiting for service... ($i/18)"
            sleep 10
          done

      - name: Verify rollback with smoke tests
        run: node backend/scripts/production_smoke_test.js
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Create rollback release note
        uses: ncipollo/release-action@v1
        with:
          tag: rollback-${{ github.run_number }}-${{ github.sha }}
          name: "⏪ Rollback to ${{ inputs.image_tag }}"
          body: |
            **Rolled back to:** `${{ inputs.image_tag }}`
            **Reason:** ${{ inputs.reason }}
            **Triggered by:** ${{ github.actor }}
            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — rollback complete
        if: success()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "⏪ *Production rolled back* to `${{ inputs.image_tag }}`.\nReason: ${{ inputs.reason }}\nTriggered by: ${{ github.actor }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — rollback FAILED
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "🔴 *ROLLBACK FAILED* — manual intervention required!\nTarget tag: `${{ inputs.image_tag }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
