name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]
        mongodb-version: ['6.0']

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: ${{ matrix.mongodb-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint
#    - name: Run tests
#      run: npm test
#      env:
#        NODE_ENV: test
#        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret_placeholder_32_characters_long' }}
#        MONGO_URI: mongodb://localhost:27017/test_db

    - name: Run build
      run: npm run build

    - name: Verify Docker build
      run: docker build .

    - name: Generate SBOM (Backend)
      run: |
        cd backend
        node scripts/security_guard.js
      
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: crammerly-sbom-${{ matrix.node-version }}
        path: backend/bom.json
        retention-days: 7
