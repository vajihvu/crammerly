# Prometheus scrape configuration for Crammerly
#
# Usage (self-hosted):
#   docker run -p 9090:9090 -v $(pwd)/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#
# Or add this job to your existing Grafana Cloud remote_write config.

global:
  scrape_interval: 30s      # Match the metrics endpoint's event-loop lag measurement window
  evaluation_interval: 30s

scrape_configs:
  - job_name: crammerly-backend
    scheme: https
    static_configs:
      - targets: ['api.crammerly.app']   # Replace with your actual API domain
    metrics_path: /metrics
    # If you add auth to /metrics later, add basic_auth or bearer_token here

  - job_name: crammerly-health
    scheme: https
    static_configs:
      - targets: ['api.crammerly.app']
    metrics_path: /health
    params:
      format: ['prometheus']
